name: Release

# Builds the desktop app for macOS (.dmg, Apple Silicon and Intel) and Windows (.exe installer, x64 only: Arm PCs run it
# under emulation, and an installer holding both builds is twice the download), smoke-tests the packaged command line on
# each, and publishes a GitHub release with the installers for tags like v1.2.0.
# Installed apps check for that release and offer the update (electron/updates.ts). Nothing is published unless both
# builds pass. Make a release with: npm version minor -m "chore(release): %s" && git push --follow-tags
# The macOS app is signed and notarized (secrets MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD, APPLE_ID,
# APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID); the Windows installer is unsigned for now.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # the app reports package.json's version: a tag that doesn't match would make every app offer this update forever
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version. Use npm version to make releases."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # macOS: signed with the Developer ID certificate and notarized by Apple (electron-builder does both when these
      # are set). Scoped to macOS: on Windows electron-builder would otherwise try to sign the .exe with CSC_LINK.
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' && 'true' || 'false' }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERT_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}

      # a missing or wrong secret would otherwise publish an app macOS refuses to open
      - name: Check the macOS app is signed and notarized
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for app in release/mac*/"Agent Fishtank.app"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl -a -t exec -vv "$app" 2>&1 | tee /dev/stderr | grep -q "source=Notarized Developer ID"
            xcrun stapler validate "$app"
          done

      - name: Smoke-test the packaged app
        shell: bash
        env:
          FISHTANK_PORT: '4399'
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude
          COPILOT_HOME: ${{ runner.temp }}/copilot
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            # the terminal tabs need node-pty's spawn-helper to be executable (scripts/after-pack.mjs)
            for helper in release/mac*/"Agent Fishtank.app"/Contents/Resources/app.asar.unpacked/node_modules/node-pty/prebuilds/darwin-*/spawn-helper; do
              [ -x "$helper" ] || { echo "not executable: $helper"; exit 1; }
            done
            fishtank() { sh "release/mac-arm64/Agent Fishtank.app/Contents/Resources/bin/fishtank.sh" "$@"; }
          else
            fishtank() { "release/win-unpacked/resources/bin/fishtank.cmd" "$@"; }
          fi
          # the status line passes your usage on and prints a default line without a status line of your own
          out=$(echo '{"model":{"display_name":"Opus"},"rate_limits":{"five_hour":{"used_percentage":40,"resets_at":1893456000}}}' | fishtank statusline 4399)
          echo "statusline: $out"
          [ "$out" = "Opus · 5h 40% used" ]
          # the session-start hook starts the app and prints nothing (Claude Code would add it to the conversation)
          out=$(echo '{}' | fishtank start)
          [ -z "$out" ]
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:4399/ && break; sleep 0.5; done
          curl -sf -o /dev/null http://127.0.0.1:4399/ && echo "app is up"

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          merge-multiple: true
      # published right away (not a draft or pre-release), so installed apps see it
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            *.dmg
            *.exe
