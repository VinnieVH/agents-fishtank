name: Release

# Builds the desktop app for macOS (.dmg, Apple Silicon and Intel) and Windows (.exe installer, x64 and Arm), smoke-tests
# the packaged command line on each, and publishes a GitHub release with the installers for tags like v1.2.0.
# Installed apps check for that release and offer the update (electron/updates.ts). Nothing is published unless both
# builds pass. Make a release with: npm version minor -m "chore(release): %s" && git push --follow-tags
# The apps are unsigned for now (see README): signing only needs certificates added as secrets here later.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # the app reports package.json's version: a tag that doesn't match would make every app offer this update forever
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version. Use npm version to make releases."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Smoke-test the packaged app
        shell: bash
        env:
          FISHTANK_PORT: '4399'
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude
          COPILOT_HOME: ${{ runner.temp }}/copilot
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            fishtank() { sh "release/mac-arm64/Agent Fishtank.app/Contents/Resources/bin/fishtank.sh" "$@"; }
          else
            fishtank() { "release/win-unpacked/resources/bin/fishtank.cmd" "$@"; }
          fi
          # the status line passes your usage on and prints a default line without a status line of your own
          out=$(echo '{"model":{"display_name":"Opus"},"rate_limits":{"five_hour":{"used_percentage":40,"resets_at":1893456000}}}' | fishtank statusline 4399)
          echo "statusline: $out"
          [ "$out" = "Opus · 5h 40% used" ]
          # the session-start hook starts the app and prints nothing (Claude Code would add it to the conversation)
          out=$(echo '{}' | fishtank start)
          [ -z "$out" ]
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:4399/ && break; sleep 0.5; done
          curl -sf -o /dev/null http://127.0.0.1:4399/ && echo "app is up"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
      # published right away (not a draft or pre-release), so installed apps see it
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.dmg
            *.exe
