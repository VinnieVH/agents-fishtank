name: Website

# Publishes the project page (site/) to GitHub Pages, together with the screenshots and icon the README and app use,
# whenever one of them changes on main. Needs Settings → Pages → Source set to "GitHub Actions" (once).
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/*.png', 'build/icon.png', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Put the page and its images together
        run: |
          mkdir _site
          cp -r site/. _site/
          cp docs/screenshot.png docs/screenshot-night.png build/icon.png _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
